{% load socialaccount %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hangarin - Login & Register</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.2/mdb.min.css" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-main, #0b1329);
        }
        .auth-card {
            max-width: 460px;
            width: 100%;
            background: var(--card-bg, #1e293b);
            border: 1px solid var(--border-color, #334155);
            border-radius: 16px;
            padding: 2.5rem;
            color: var(--text-primary, #f8fafc);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        
        .auth-card .nav-pills {
            display: flex;
            gap: 12px;
            width: 100%;
        }
        .auth-card .nav-pills .nav-item {
            flex: 1;
        }
        .auth-card .nav-pills .nav-link {
            width: 100%;
            text-align: center;
            padding: 0.6rem 1rem;
            border-radius: 10px;
            font-weight: 600;
            background-color: var(--bg-sidebar, #0f172a);
            color: var(--text-secondary, #94a3b8);
            border: 1px solid var(--border-color, #334155);
            transition: all 0.2s ease;
        }
        .auth-card .nav-pills .nav-link.active {
            background-color: var(--accent-cyan, #06b6d4) !important;
            color: #0f172a !important;
            border-color: var(--accent-cyan, #06b6d4) !important;
        }

        .form-control {
            background-color: var(--bg-sidebar, #0f172a) !important;
            border: 1px solid var(--border-color, #334155) !important;
            color: var(--text-primary, #f8fafc) !important;
        }
        .form-control:focus {
            border-color: var(--accent-cyan, #06b6d4) !important;
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15) !important;
        }

        .social-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }
        .btn-social {
            background-color: var(--bg-sidebar, #0f172a);
            border: 1px solid var(--border-color, #334155);
            color: var(--accent-cyan, #06b6d4);
            font-size: 1.2rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .btn-social:hover {
            border-color: var(--accent-cyan, #06b6d4);
            color: #ffffff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="text-center mb-4">
        <h3 class="fw-bold mb-1"><i class="fa-solid fa-check-double me-2" style="color: var(--accent-cyan, #06b6d4);"></i>Hangarin</h3>
        <p class="text-muted small mb-0">Task Management App</p>
    </div>

    <!-- Symmetrical Inline Nav Tabs -->
    <ul class="nav nav-pills mb-4" id="pills-tab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="tab-login" data-mdb-toggle="pill" data-mdb-target="#pills-login" type="button" role="tab">LOGIN</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-register" data-mdb-toggle="pill" data-mdb-target="#pills-register" type="button" role="tab">REGISTER</button>
        </li>
    </ul>

    <div class="tab-content">
        <!-- Login Tab -->
        <div class="tab-pane fade show active" id="pills-login" role="tabpanel">
            <div class="text-center mb-3"> 
                <p class="small text-muted mb-2">Sign in with:</p> 
                <div class="social-container">
                    <a href="{% provider_login_url 'google' %}" class="btn-social"><i class="fab fa-google"></i></a> 
                    <a href="{% provider_login_url 'github' %}" class="btn-social"><i class="fab fa-github"></i></a>
                </div>
            </div>

            <form method="post" action="{% url 'account_login' %}">
                {% csrf_token %}
                
                <div class="form-outline mb-3" data-mdb-input-init>
                    <input type="text" name="login" id="id_login" class="form-control" required />
                    <label class="form-label text-muted" for="id_login">Email or Username</label>
                </div>

                <div class="form-outline mb-3" data-mdb-input-init>
                    <input type="password" name="password" id="id_password" class="form-control" required />
                    <label class="form-label text-muted" for="id_password">Password</label>
                </div>

                {% if form.non_field_errors %}
                    <div class="alert alert-danger py-2 small" role="alert">
                        {% for error in form.non_field_errors %}
                            <p class="mb-0">{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endif %}

                <button type="submit" class="btn btn-info w-100 py-2 mt-2 fw-bold text-dark" style="background-color: var(--accent-cyan, #06b6d4); border: none;">SIGN IN</button>
            </form>
        </div>

        <div class="tab-pane fade" id="pills-register" role="tabpanel">
            <div class="text-center mb-3">
                <p class="small text-muted mb-2">Sign up with:</p>
                <div class="social-container">
                    <a href="{% provider_login_url 'google' %}" class="btn-social"><i class="fab fa-google"></i></a>
                    <a href="{% provider_login_url 'github' %}" class="btn-social"><i class="fab fa-github"></i></a>
                </div>
            </div>

            <form method="post" action="{% url 'account_signup' %}">
                {% csrf_token %}

                <div class="form-outline mb-3" data-mdb-input-init>
                    <input type="text" name="username" id="registerUsername" class="form-control" required />
                    <label class="form-label text-muted" for="registerUsername">Username</label>
                </div>

                <div class="form-outline mb-3" data-mdb-input-init>
                    <input type="email" name="email" id="registerEmail" class="form-control" required />
                    <label class="form-label text-muted" for="registerEmail">Email</label>
                </div>

                <div class="form-outline mb-3" data-mdb-input-init>
                    <input type="password" name="password1" id="registerPassword" class="form-control" required />
                    <label class="form-label text-muted" for="registerPassword">Password</label>
                </div>

                <div class="form-outline mb-3" data-mdb-input-init>
                    <input type="password" name="password2" id="registerRepeatPassword" class="form-control" required />
                    <label class="form-label text-muted" for="registerRepeatPassword">Repeat Password</label>
                </div>

                <button type="submit" class="btn btn-info w-100 py-2 mt-2 fw-bold text-dark" style="background-color: var(--accent-cyan, #06b6d4); border: none;">REGISTER</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.2/mdb.min.js"></script>
</body>
</html>
